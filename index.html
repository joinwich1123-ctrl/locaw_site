<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xuân Lộc VIPPRO</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background:
    radial-gradient(
      ellipse at center,
      #191714 0%,
      #090909 48%,
      #000000 100%
    );
  font-family: "Times New Roman", serif;
}

.container {
  position: relative;
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.frame {
  position: relative;
  padding: 48px 28px;
  text-align: center;
  max-width: 100%;
}

.frame::before,
.frame::after {
  content: "";
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: min(75%, 360px);
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    #a78343,
    #f9e6b1,
    #a78343,
    transparent
  );
}

.frame::before {
  top: 0;
}

.frame::after {
  bottom: 0;
}

h1 {
  font-size: clamp(30px, 7vw, 76px);
  font-weight: 600;
  letter-spacing: 0.09em;
  line-height: 1.3;
  white-space: nowrap;

  background: linear-gradient(
    180deg,
    #fff4cf 0%,
    #e7ca82 25%,
    #b58b45 52%,
    #f8e5ad 76%,
    #ad8140 100%
  );

  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;

  filter: drop-shadow(0 0 18px rgba(218, 174, 91, 0.16));
  animation: appear 1.5s ease both;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(12px);
    filter: blur(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }
}

@media (max-width: 400px) {
  h1 {
    font-size: 27px;
    letter-spacing: 0.055em;
  }

  .frame {
    padding: 38px 12px;
  }
}
</style>
</head>

<body>
  <main class="container">
    <div class="frame">
      <h1>Xuân Lộc VIPPRO</h1>
    </div>
  </main>
</body>
</html>
