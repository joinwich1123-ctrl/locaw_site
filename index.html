<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xuân Lộc VIPPRO</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100%;
  height: 100vh;
  overflow: hidden;
  background: #030303;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Times New Roman", serif;
}

.scene {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(
    ellipse at center,
    #17130d 0%,
    #080807 42%,
    #030303 75%
  );
}

/* Ánh sáng lóe giữa màn hình */
.flash {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #fff5d7;
  transform: translate(-50%, -50%);
  box-shadow:
    0 0 25px 12px rgba(255, 226, 153, .9),
    0 0 90px 35px rgba(255, 190, 75, .55),
    0 0 180px 65px rgba(255, 166, 45, .22);
  opacity: 0;
  animation: flash 1.4s ease-out .15s forwards;
}

/* Tia sáng quét ngang */
.beam {
  position: absolute;
  left: -60%;
  top: 50%;
  width: 60%;
  height: 2px;
  transform: translateY(-50%);
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255, 210, 112, .2),
    #fff6d8,
    rgba(255, 208, 102, .7),
    transparent
  );
  box-shadow: 0 0 24px 5px rgba(255, 203, 91, .55);
  opacity: 0;
  animation: sweep 1.4s ease-in-out .25s forwards;
}

/* Logo */
.logo {
  position: relative;
  z-index: 2;
  padding: 20px;
  text-align: center;
  opacity: 0;
  transform: scale(.82);
  animation: reveal 1.3s cubic-bezier(.2,.8,.2,1) 1.05s forwards;
}

h1 {
  position: relative;
  font-size: clamp(29px, 7vw, 76px);
  font-weight: 600;
  letter-spacing: .08em;
  white-space: nowrap;
  line-height: 1.3;

  background: linear-gradient(
    180deg,
    #fff9df 0%,
    #f5dfaa 20%,
    #c49b54 48%,
    #fff0bf 65%,
    #b78a42 100%
  );

  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;

  filter: drop-shadow(0 0 15px rgba(224, 179, 88, .2));
  animation: goldenGlow 3s ease-in-out 2.4s infinite alternate;
}

/* Ánh sáng chạy qua dòng chữ */
h1::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    110deg,
    transparent 25%,
    rgba(255,255,255,0) 38%,
    rgba(255,255,255,.95) 50%,
    rgba(255,238,183,.5) 54%,
    transparent 68%
  );
  background-size: 220% 100%;
  background-position: 150% 0;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  pointer-events: none;
  animation: textShine 1.5s ease-in-out 2.25s both;
}

@keyframes flash {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(.1);
  }
  20% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  45% {
    opacity: .9;
    transform: translate(-50%, -50%) scale(1.5);
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(5);
  }
}

@keyframes sweep {
  0% {
    opacity: 0;
    left: -60%;
  }
  25% {
    opacity: 1;
  }
  70% {
    opacity: .8;
  }
  100% {
    opacity: 0;
    left: 110%;
  }
}

@keyframes reveal {
  0% {
    opacity: 0;
    transform: scale(.82);
    filter: blur(12px);
  }
  60% {
    opacity: 1;
    transform: scale(1.04);
    filter: blur(0);
  }
  100% {
    opacity: 1;
    transform: scale(1);
    filter: blur(0);
  }
}

@keyframes textShine {
  0% {
    background-position: 150% 0;
  }
  100% {
    background-position: -150% 0;
  }
}

@keyframes goldenGlow {
  from {
    filter: drop-shadow(0 0 9px rgba(225, 183, 98, .2));
  }
  to {
    filter: drop-shadow(0 0 23px rgba(255, 213, 121, .55));
  }
}

/* Tôn trọng cài đặt giảm chuyển động */
@media (prefers-reduced-motion: reduce) {
  .flash, .beam, .logo, h1, h1::after {
    animation: none;
  }
  .logo {
    opacity: 1;
    transform: none;
  }
}
</style>
</head>

<body>
  <main class="scene">
    <div class="flash"></div>
    <div class="beam"></div>
    <div class="logo">
      <h1>Xuân Lộc VIPPRO</h1>
    </div>
  </main>
</body>
</html>
